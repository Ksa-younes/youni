<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: #f6f8fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 0;
            padding: 40px;
            text-align: center;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        img {
            width: 70px;
            margin-bottom: 20px;
        }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { color: #57606a; font-size: 15px; line-height: 1.7; }
        .status-pill {
            background: #e6f4ea;
            color: #1e8e3e;
            padding: 4px 16px;
            border-radius: 0;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://amoqdnddxbfclqivvhiy.supabase.co/storage/v1/object/public/Youni/app/logo.png" alt="Logo">
        <div class="status-pill">قيد الصيانة</div>
        <h1>سنعود قريباً</h1>
        <p>نعتذر عن هذا الإزعاج، الموقع حالياً قيد الصيانة الدورية. يرجى المحاولة لاحقاً.</p>
    </div>
</body>
</html>
